services:
  - type: pserv
    name: communityhub-api
    runtime: docker
    repo: https://github.com/persadenis/UBB-SE-2026-CommunityHub
    branch: main
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: RENDER
        value: true
      - key: PORT
        value: 10000
      - key: DatabaseProvider
        value: PostgreSQL
      - key: ConnectionStrings__ChatAndEventsDB
        fromDatabase:
          name: communityhub-db
          property: connectionString

  - type: web
    name: communityhub-web
    runtime: docker
    repo: https://github.com/persadenis/UBB-SE-2026-CommunityHub
    branch: main
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: communityhub-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: RENDER
        value: true
      - key: PORT
        value: 10000
      - key: UPLOADS_ROOT
        value: /var/data/uploads
      - key: DatabaseProvider
        value: PostgreSQL
      - key: API_HOSTPORT
        fromService:
          type: pserv
          name: communityhub-api
          property: hostport
      - key: ConnectionStrings__ChatAndEventsDB
        fromDatabase:
          name: communityhub-db
          property: connectionString

databases:
  - name: communityhub-db
    databaseName: communityhub
    user: communityhub
    plan: basic-256mb
